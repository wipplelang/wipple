[package]
name = "wipple-cli"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "wipple"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.13"
colored = "3"
rayon = "1"
reqwest = { version = "0.13", features = ["blocking"] }
rmp-serde = "1"
rustyline = { version = "18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wipple-core = { path = "../core" }
wipple-feedback = { path = "../feedback" }
wipple-parse = { path = "../parse" }
wipple-queries = { path = "../queries" }
wipple-syntax = { path = "../syntax" }
